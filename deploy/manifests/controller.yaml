apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: kubeedgeinfer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keinfer-controller
  template:
    metadata:
      labels:
        app: keinfer-controller
    spec:
      serviceAccountName: keinfer-controller
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: controller
          image: kubeedgeinfer/controller:dev
          imagePullPolicy: IfNotPresent
          args: []
          env:
            - name: NAMESPACE
              value: kubeedgeinfer
            - name: STATIC_MODE
              value: "0"
          ports:
            - containerPort: 50053
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: kubeedgeinfer
spec:
  selector:
    app: keinfer-controller
  ports:
    - name: telemetry
      port: 50053
      targetPort: 50053
    - name: http
      port: 8081
      targetPort: 8081
