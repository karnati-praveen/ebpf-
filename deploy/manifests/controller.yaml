apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
  namespace: shardwise
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shardwise-controller
  template:
    metadata:
      labels:
        app: shardwise-controller
    spec:
      serviceAccountName: shardwise-controller
      # Exists, not a nodeSelector: kind uses an empty label value, k3s uses
      # "true" (see workers.yaml for the full note).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: controller
          image: shardwise/controller:dev
          imagePullPolicy: IfNotPresent
          # The binary defaults to -mode=standalone, so the Kubernetes
          # deployment must ask for the k8s substrate explicitly.
          args: ["-mode=k8s"]
          env:
            - name: NAMESPACE
              value: shardwise
            - name: STATIC_MODE
              value: "0"
          ports:
            - containerPort: 50053
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: controller
  namespace: shardwise
spec:
  selector:
    app: shardwise-controller
  ports:
    - name: telemetry
      port: 50053
      targetPort: 50053
    - name: http
      port: 8081
      targetPort: 8081
