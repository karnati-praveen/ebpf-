# One shard worker per labeled node (the pipeline topology), plus the router.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: keinfer-worker
  namespace: kubeedgeinfer
spec:
  selector:
    matchLabels:
      app: keinfer-worker
  template:
    metadata:
      labels:
        app: keinfer-worker
    spec:
      nodeSelector:
        kubeedgeinfer.io/worker: "true"
      containers:
        - name: worker
          image: kubeedgeinfer/worker:dev
          imagePullPolicy: IfNotPresent
          command: ["python3", "server.py"]
          ports:
            - containerPort: 50051
          env:
            - name: PORT
              value: "50051"
            - name: WORKER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: NODE_AGENT_ADDR
              value: "$(HOST_IP):9101"
            - name: SIM_PER_LAYER_MS
              value: "30"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: kubeedgeinfer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keinfer-router
  template:
    metadata:
      labels:
        app: keinfer-router
    spec:
      # Keep the router off the worker nodes: injected faults (netem, node
      # kill) must degrade pipeline stages, not the orchestration path.
      # Matched with Exists, not a nodeSelector: kind labels the control
      # plane with an empty value but k3s uses "true", and a nodeSelector
      # compares values exactly -- so a selector that works on kind would
      # leave this pod Pending forever on a real k3s cluster.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: router
          image: kubeedgeinfer/worker:dev
          imagePullPolicy: IfNotPresent
          command: ["python3", "router.py"]
          ports:
            - containerPort: 8080
            - containerPort: 50052
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: GRPC_PORT
              value: "50052"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: kubeedgeinfer
spec:
  selector:
    app: keinfer-router
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50052
      targetPort: 50052
