apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencepipelines.kubeedgeinfer.io
spec:
  group: kubeedgeinfer.io
  scope: Namespaced
  names:
    kind: InferencePipeline
    plural: inferencepipelines
    singular: inferencepipeline
    shortNames: [ipl]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Bottleneck
          type: string
          jsonPath: .status.bottleneckMs
        - name: Generation
          type: integer
          jsonPath: .status.generation
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [totalLayers]
              properties:
                model:
                  type: string
                  description: model name for the gpt2 backend
                backend:
                  type: string
                  enum: [sim, gpt2]
                  default: sim
                totalLayers:
                  type: integer
                  minimum: 1
                perLayerMs:
                  type: number
                  description: baseline per-layer compute cost at full speed
                workers:
                  type: integer
                  description: expected worker count (static mode waits for all)
                routerAddr:
                  type: string
                  description: router gRPC address for SetPipeline
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
