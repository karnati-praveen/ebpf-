apiVersion: v1
kind: ServiceAccount
metadata:
  name: shardwise-controller
  namespace: shardwise
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shardwise-controller
  namespace: shardwise
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [shardwise.io]
    resources: [inferencepipelines]
    verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shardwise-controller
  namespace: shardwise
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shardwise-controller
subjects:
  - kind: ServiceAccount
    name: shardwise-controller
    namespace: shardwise
