apiVersion: v1
kind: ServiceAccount
metadata:
  name: keinfer-controller
  namespace: kubeedgeinfer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keinfer-controller
  namespace: kubeedgeinfer
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [kubeedgeinfer.io]
    resources: [inferencepipelines]
    verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keinfer-controller
  namespace: kubeedgeinfer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keinfer-controller
subjects:
  - kind: ServiceAccount
    name: keinfer-controller
    namespace: kubeedgeinfer
